apiVersion: v1
kind: Pod
metadata:
  name: hw5-low-priority
  namespace: hw5
spec:
  priorityClassName: hw5-low
  restartPolicy: Never
  containers:
    - name: worker
      image: hw5-skills:1
      imagePullPolicy: Never
      command:
        - python
        - -c
        - "import time; time.sleep(900)"
      resources:
        requests:
          cpu: 6500m
          memory: 64Mi
        limits:
          memory: 128Mi
