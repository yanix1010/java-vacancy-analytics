apiVersion: batch/v1
kind: Job
metadata:
  name: hw5-parallel-mapreduce
  namespace: hw5
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mapper
          image: hw5-skills:1
          imagePullPolicy: Never
          command:
            - python
            - -u
            - /app/partition_worker.py
          env:
            - name: RUSTFS_ENDPOINT
              value: http://rustfs.hw5.svc.cluster.local:9000
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
          envFrom:
            - secretRef:
                name: rustfs-credentials
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: worker
              mountPath: /app/partition_worker.py
              subPath: partition_worker.py
      volumes:
        - name: worker
          configMap:
            name: hw5-partition-worker
