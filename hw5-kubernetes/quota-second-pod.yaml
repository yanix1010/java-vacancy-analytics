apiVersion: v1
kind: Pod
metadata:
  name: quota-second
  namespace: hw5-quota
spec:
  restartPolicy: Never
  containers:
    - name: worker
      image: hw5-skills:1
      imagePullPolicy: Never
      command:
        - python
        - -c
        - "import time; time.sleep(900)"
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
