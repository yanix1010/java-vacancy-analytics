services:
  zoo1:
    image: zookeeper:3.9.6-jre-17
    hostname: zoo1
    ports:
      - "127.0.0.1:2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: "server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181"
    volumes:
      - ./data/zoo1:/data
      - ./datalog/zoo1:/datalog

  zoo2:
    image: zookeeper:3.9.6-jre-17
    hostname: zoo2
    ports:
      - "127.0.0.1:2182:2181"
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: "server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181"
    volumes:
      - ./data/zoo2:/data
      - ./datalog/zoo2:/datalog

  zoo3:
    image: zookeeper:3.9.6-jre-17
    hostname: zoo3
    ports:
      - "127.0.0.1:2183:2181"
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: "server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181"
    volumes:
      - ./data/zoo3:/data
      - ./datalog/zoo3:/datalog
